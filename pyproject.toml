[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swipe_modules"
version = "0.2.0"
description = "Routines that adapt litebird_sim to LSPE-SWIPE"
readme = "README.md"
license = {text = "GPL"}
requires-python = ">=3.10,<3.14"
authors = [
    {name = "Luca Pagano", email = "luca.pagano@unife.it"}
]
keywords = ["astronomy", "simulation", "scanning"]
dependencies = [
    "numpy>=1.26.4",
    "numba>=0.61.2",
    "astropy>=6.1.7",
    "litebird_sim>=0.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.10",
    "pyerfa>=2.0",
    "black>=22.0",
    "ruff>=0.1.0",
    "mypy>=0.990",
]

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["swipe_modules*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
# N802: private njit kernels follow physics-formula naming (e.g. _SWIPEspin_*,
# a leftover from before common.py's precession helpers were cleaned up)
# rather than PEP8 casing; renaming is pure churn.
ignore = ["N802"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
